<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover 是必须的：targetSdk 36 → Android 15+ 强制 edge-to-edge，
      WebView 会铺到状态栏/导航栏下面。没有这个标记时 env(safe-area-inset-*) 恒为 0，
      外壳就无法给状态栏留位置 —— 表现为"顶部被白屏遮住一点空间"（真机实测标题落在状态栏带内）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NativeThink</title>
    <!-- Preconnect to Google Fonts origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking font loading: reduced weights (400/600/700) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" />
    </noscript>
    <link href="https://lf3-static.bytednsdoc.com/obj/eden-cn/ylcylz_fsph_ryhs/ljhwZthlaukjlkulzlp/feisuda/feisuda.svg" rel="shortcut icon"/>
  </head>
  <body>
    <div id="root"></div>
  <script>
    // 移动端（Capacitor APK）：/api/* 走云端 Pages 部署
    if (window.Capacitor) {
      window.__API_BASE__ = 'https://nativethink.pages.dev';
      const __of = window.fetch.bind(window);
      window.fetch = function (input, init) {
        if (typeof input === 'string' && input.indexOf('/api/') === 0) input = window.__API_BASE__ + input;
        return __of(input, init);
      };
    }
  </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover 是必须的：targetSdk 36 → Android 15+ 强制 edge-to-edge，
      WebView 会铺到状态栏/导航栏下面。没有这个标记时 env(safe-area-inset-*) 恒为 0，
      外壳就无法给状态栏留位置 —— 表现为"顶部被白屏遮住一点空间"（真机实测标题落在状态栏带内）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NativeThink</title>
    <!-- 构建期由 vite.config.ts 的 fixHtmlPlaceholders 把 {{appVersion}} 换成版本号（读 android/version.properties）；
         scripts/ensure-web-build.mjs 靠这处标记拦「打进上次产物」，占位符形态不许手改。 -->
    <meta name="app-version" content="{{appVersion}}" />
    <!-- 字体自托管（大陆可达）。
         英文：Plus Jakarta Sans latin 子集 400/600/700（@fontsource，OFL 见 LICENSE.txt）。
         中文：Noto Sans SC 简体子集 400/500/600/700（@fontsource/noto-sans-sc@5.3.1，
         OFL 见 LICENSE-noto-sans-sc.txt）。该子集自带完整 Basic Latin（U+0020-00FF）与常用标点，
         因此 Noto 是唯一首选家族 —— 中英文都直取 webfont，不做家族间逐字回退。
         原因（2026-10-21 真机 A/B）：这台 Onyx ROM 的 WebView 在"第一个家族缺字"时直接走
         系统回退（= 用户装的书法体），不尝试后面的 CSS 字体家族；把 Noto 放第一、
         且不去掉 unicode-range 都会复现书法体。 -->

    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-display: swap; font-weight: 400; src: url(/fonts/plus-jakarta-sans-latin-400-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-display: swap; font-weight: 600; src: url(/fonts/plus-jakarta-sans-latin-600-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-display: swap; font-weight: 700; src: url(/fonts/plus-jakarta-sans-latin-700-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Noto Sans SC'; font-style: normal; font-display: swap; font-weight: 400; src: url(/fonts/noto-sans-sc-400-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Noto Sans SC'; font-style: normal; font-display: swap; font-weight: 500; src: url(/fonts/noto-sans-sc-500-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Noto Sans SC'; font-style: normal; font-display: swap; font-weight: 600; src: url(/fonts/noto-sans-sc-600-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Noto Sans SC'; font-style: normal; font-display: swap; font-weight: 700; src: url(/fonts/noto-sans-sc-700-normal.woff2) format('woff2'); }
    </style>
  </head>
  <body>
    <div id="root"></div>
  <script>
    // 移动端（Capacitor APK）：/api/* 走云端 Pages 部署
    if (window.Capacitor) {
      window.__API_BASE__ = 'https://nativethink.pages.dev';
      const __of = window.fetch.bind(window);
      window.fetch = function (input, init) {
        if (typeof input === 'string' && input.indexOf('/api/') === 0) input = window.__API_BASE__ + input;
        return __of(input, init);
      };
    }
  </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

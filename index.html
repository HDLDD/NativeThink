<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover 是必须的：targetSdk 36 → Android 15+ 强制 edge-to-edge，
      WebView 会铺到状态栏/导航栏下面。没有这个标记时 env(safe-area-inset-*) 恒为 0，
      外壳就无法给状态栏留位置 —— 表现为"顶部被白屏遮住一点空间"（真机实测标题落在状态栏带内）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NativeThink</title>
    <!-- 构建期由 vite.config.ts 的 fixHtmlPlaceholders 把 {{appVersion}} 换成版本号（读 android/version.properties）；
         scripts/ensure-web-build.mjs 靠这处标记拦「打进上次产物」，占位符形态不许手改。 -->
    <meta name="app-version" content="{{appVersion}}" />
    <!-- 品牌字体自托管（大陆可达）：Plus Jakarta Sans latin 子集 400/600/700，共约 36KB。
         文件来自 @fontsource/plus-jakarta-sans@5.3.0（与 fonts.googleapis.com 同一份 woff2），
         放 public/fonts/，OFL 许可证随附见 public/fonts/LICENSE.txt。原外链 fonts.googleapis.com
         对大陆不可达 —— 每条路由报一次资源错误且字体从未生效（ROADMAP #7，2026-10-05 落地）。
         中文也自托管：部分 ROM（实测 Onyx 25053RT47C）把系统所有中文字体族映射成书法体
         "WDNSSMJS"，显式指定 Noto/思源也无效 —— 只能随包带一份。用 Noto Sans SC 简体子集
         400/500/600/700（@fontsource/noto-sans-sc@5.3.1，OFL 见 LICENSE-noto-sans-sc.txt），
         unicode-range 只吃 CJK，英文继续走 Plus Jakarta Sans。 -->
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-display: swap; font-weight: 400; src: url(/fonts/plus-jakarta-sans-latin-400-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-display: swap; font-weight: 600; src: url(/fonts/plus-jakarta-sans-latin-600-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-display: swap; font-weight: 700; src: url(/fonts/plus-jakarta-sans-latin-700-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Noto Sans SC'; font-style: normal; font-display: swap; font-weight: 400; src: url(/fonts/noto-sans-sc-400-normal.woff2) format('woff2'); unicode-range: U+2E80-2FFF, U+3000-303F, U+31C0-31EF, U+3200-32FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
      @font-face { font-family: 'Noto Sans SC'; font-style: normal; font-display: swap; font-weight: 500; src: url(/fonts/noto-sans-sc-500-normal.woff2) format('woff2'); unicode-range: U+2E80-2FFF, U+3000-303F, U+31C0-31EF, U+3200-32FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
      @font-face { font-family: 'Noto Sans SC'; font-style: normal; font-display: swap; font-weight: 600; src: url(/fonts/noto-sans-sc-600-normal.woff2) format('woff2'); unicode-range: U+2E80-2FFF, U+3000-303F, U+31C0-31EF, U+3200-32FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
      @font-face { font-family: 'Noto Sans SC'; font-style: normal; font-display: swap; font-weight: 700; src: url(/fonts/noto-sans-sc-700-normal.woff2) format('woff2'); unicode-range: U+2E80-2FFF, U+3000-303F, U+31C0-31EF, U+3200-32FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  <script>
    // 移动端（Capacitor APK）：/api/* 走云端 Pages 部署
    if (window.Capacitor) {
      window.__API_BASE__ = 'https://nativethink.pages.dev';
      const __of = window.fetch.bind(window);
      window.fetch = function (input, init) {
        if (typeof input === 'string' && input.indexOf('/api/') === 0) input = window.__API_BASE__ + input;
        return __of(input, init);
      };
    }
  </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
